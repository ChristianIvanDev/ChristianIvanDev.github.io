<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Portada de Facebook</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=block" rel="stylesheet" />
<style>
  /* 1640×856: Facebook muestra el centro (unos 1640×624) en escritorio y recorta los lados en móvil.
     Todo lo importante va dentro de la zona segura central (x 220–1420, y 140–716). */
  :root { --bg:#5b21b6; --deep:#3b0f80; --card:#6d28d9; --border:#8b5cf6; --pink:#fbe1ea; --pinkShadow:#c98aa3; --ink:#3b0f80; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1640px; height: 856px; overflow: hidden; background: var(--bg); font-family: 'Nunito', sans-serif; color: #fff; }
  .blk { position: absolute; border-radius: 22px; box-shadow: 0 10px 0 var(--deep); }
  .main { position: absolute; left: 340px; width: 960px; top: 185px; text-align: center; }
  .eyebrow { font-weight: 900; font-size: 24px; letter-spacing: .12em; color: var(--pink); text-transform: uppercase; }
  h1 { margin: 14px 0 0; font-family: 'Lilita One'; font-weight: 400; font-size: 76px; line-height: .98; text-transform: uppercase; text-shadow: 0 10px 0 var(--deep); }
  .chips { display: flex; justify-content: center; gap: 12px; margin-top: 26px; }
  .chip { padding: 9px 20px; border-radius: 999px; background: var(--card); border: 3px solid var(--border); box-shadow: 0 6px 0 var(--deep); font-weight: 900; font-size: 24px; }
  .chip.pink { background: var(--pink); color: var(--ink); border-color: #fff; box-shadow: 0 6px 0 var(--pinkShadow); }
  .cta { display: inline-flex; align-items: center; gap: 16px; margin-top: 28px; padding: 14px 30px; border-radius: 999px; background: var(--pink); color: var(--ink); font-family: 'Lilita One'; font-size: 32px; text-transform: uppercase; box-shadow: 0 8px 0 var(--pinkShadow); white-space: nowrap; }
  .cta small { font-family: 'Nunito'; font-weight: 900; font-size: 21px; text-transform: none; opacity: .85; }
  .card { position: absolute; border: 5px solid var(--border); border-radius: 34px; overflow: hidden; box-shadow: 0 14px 0 var(--deep); background: var(--card); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stat { position: absolute; left: 1010px; top: 560px; padding: 14px 26px; border-radius: 24px; background: var(--pink); color: var(--ink); box-shadow: 0 8px 0 var(--pinkShadow); text-align: center; }
  .stat b { display: block; font-family: 'Lilita One'; font-weight: 400; font-size: 58px; line-height: 1; }
  .stat span { font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
  <div class="blk" style="left:60px; top:70px; width:110px; height:110px; background:#f9c9da; transform:rotate(12deg)"></div>
  <div class="blk" style="left:1500px; top:90px; width:90px; height:90px; background:#8b5cf6; border-radius:50%"></div>
  <div class="blk" style="left:90px; top:640px; width:80px; height:80px; background:#7c3aed; transform:rotate(-10deg)"></div>
  <div class="blk" style="left:1480px; top:660px; width:100px; height:100px; background:#fbe1ea; transform:rotate(16deg)"></div>

  <div class="main">
    <div class="eyebrow">Clases en línea · Programación, diseño y desarrollo</div>
    <h1>Aprende a crear<br>juegos, webs y diseño</h1>
    <div class="chips"><span class="chip">Lógica</span><span class="chip">Python</span><span class="chip">Roblox</span><span class="chip">Webs</span><span class="chip pink">+2,000 clases</span></div>
    <div class="cta">Agenda tu primera clase <small>christianivandev.github.io</small></div>
  </div>

  <!-- Decoración a los lados: en el móvil se recorta y no pasa nada -->
  <div class="card" style="left:-40px; top:230px; width:360px; height:250px; transform:rotate(-6deg)"><img src="../../public/assets/projects/caza-de-monstruos/1.webp"></div>
  <div class="card" style="left:1330px; top:250px; width:360px; height:250px; transform:rotate(6deg)"><img src="../../public/assets/projects/build-a-pipe/1.webp"></div>
</body>
</html>
